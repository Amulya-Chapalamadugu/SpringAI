spring.application.name=openai

#This tells Spring Boot to use your custom format
# for all log messages printed to the console
logging.pattern.console = %green(%d{HH:mm:ss:SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

#configuring openAI API key
#spring.ai.openai.apiKey = ${OPENAI_API_KEY}

#to let chatClient know which llm model to use
spring.ai.model.chat = ollama

#By using this we need to tell to the springAI
# framework which specific LLM model I am running inside my local system
spring.ai.ollama.chat.model = llama3.2